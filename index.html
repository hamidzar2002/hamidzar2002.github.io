<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Official developer website for apps by Hamid Zarrazvand.">
  <title>Hamid Zarrazvand Apps</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #050b12;
      color: #eef5ff;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 20% 20%, rgb(65 210 226 / 16%), transparent 35%),
        radial-gradient(circle at 80% 70%, rgb(158 232 103 / 12%), transparent 38%),
        #050b12;
    }

    main {
      width: min(680px, calc(100% - 40px));
      padding: 48px;
      border: 1px solid #20344a;
      border-radius: 28px;
      background: rgb(11 22 35 / 88%);
      box-shadow: 0 30px 80px rgb(0 0 0 / 35%);
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2.2rem, 7vw, 4rem);
      letter-spacing: -0.04em;
    }

    p {
      margin: 0;
      color: #aebdd0;
      font-size: 1.1rem;
      line-height: 1.7;
    }

    .apps {
      display: grid;
      gap: 14px;
      margin-top: 30px;
    }

    .app {
      padding: 18px 20px;
      border: 1px solid #263a50;
      border-radius: 16px;
      background: #0d1a29;
    }

    .app strong {
      display: block;
      margin-bottom: 4px;
      color: #eef5ff;
    }
  </style>
</head>
<body>
  <main>
    <h1>Hamid Zarrazvand Apps</h1>
    <p>Official developer website for independently built mobile puzzle games.</p>
    <section class="apps" aria-label="Apps">
      <div class="app">
        <strong>Galaxies Logic Puzzle</strong>
        <span>Draw borders and create rotationally symmetric galaxies.</span>
      </div>
      <div class="app">
        <strong>Untangle</strong>
        <span>Move connected nodes until no lines cross.</span>
      </div>
    </section>
  </main>
</body>
</html>
